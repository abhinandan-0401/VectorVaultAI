version: '3'
services:
  api:
    build:
      context: ./api
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_KEY=your_openai_key
      - GCS_BUCKET_NAME=your_bucket_name
      - PORT=8080
  
  ui:
    build:
      context: ./ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8080
      - PORT=8501
    depends_on:
      - api 